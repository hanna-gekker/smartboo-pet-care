<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SmartBoo — background & tab bar</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E6EAE5;font-family:Geist,system-ui,sans-serif;color:#111;padding:28px}
  h1{font-size:20px;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,300px);gap:24px}
  h2{font-size:15px;margin:0 0 4px}p{font-size:13px;color:#555;margin:0 0 12px;min-height:34px}
  .frame{width:300px;height:648px;overflow:hidden;border-radius:12px}
  iframe{width:438px;height:946px;border:0;transform:scale(.685);transform-origin:0 0}
</style></head><body>
<h1>Today · top glow × tab bar</h1>
<div class="grid">
  <div><h2>A · Current</h2><p>Strong mint glow, dark tab bar.</p><div class="frame"><iframe src="today-screen.html?embed&v=9"></iframe></div></div>
  <div><h2>B · Soft glow + dark bar</h2><p>Glow at 30% — a hint of colour, not a wash.</p><div class="frame"><iframe src="today-screen.html?embed&glow=soft&v=9"></iframe></div></div>
  <div><h2>C · Soft glow + light bar</h2><p>White bar with a hairline, active tab in ink.</p><div class="frame"><iframe src="today-screen.html?embed&glow=soft&bar=light&v=9"></iframe></div></div>
  <div><h2>D · No glow + light bar</h2><p>Calmest: flat paper, contrast from cards and ink.</p><div class="frame"><iframe src="today-screen.html?embed&glow=none&bar=light&v=9"></iframe></div></div>
</div></body></html>
